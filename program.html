<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program Details | Steps For Social Change</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #2d6a4f;
      --primary-light: #52b788;
      --dark: #1b4332;
      --bg: #f8f9fa;
      --text: #2b2d42;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.7;
    }
    .hero-banner {
      background: linear-gradient(135deg, var(--dark), var(--primary));
      color: white;
      padding: 60px 20px;
      text-align: center;
    }
    .hero-banner h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .container {
      max-width: 900px;
      margin: -40px auto 60px;
      padding: 0 20px;
    }
    .article-card {
      background: white;
      border-radius: 16px;
      padding: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      margin-bottom: 30px;
    }
    .featured-img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 25px;
    }
    .meta-info {
      display: flex;
      gap: 20px;
      color: #6c757d;
      font-size: 0.9rem;
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 25px;
    }
    .gallery-grid img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .gallery-grid img:hover {
      transform: scale(1.03);
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <header class="hero-banner">
    <span class="badge" id="program-category">Empowering Grassroots</span>
    <h1 id="program-title">Plantation Drive at Food Corporation of India</h1>
  </header>

  <main class="container">
    <a href="index.html#our-programmes" class="back-btn">← Back to Programmes</a>

    <div id="posts-feed">
      <article class="article-card">
        <p>Loading updates...</p>
      </article>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetCategory = params.get('category') || 'empowering-grassroots';

    document.getElementById('program-category').innerText = targetCategory.replace('-', ' ');

    async function loadCategoryPosts() {
      const feed = document.getElementById('posts-feed');
      try {
        const res = await fetch('https://api.github.com/repos/VADITHYKISHORENAIK/stepsforsocialchange/contents/content/programs');
        const files = await res.json();

        if (!Array.isArray(files) || files.length === 0) {
          feed.innerHTML = '<div class="article-card"><p>No updates published for this program yet.</p></div>';
          return;
        }

        feed.innerHTML = '';
        let matched = false;

        for (let file of files) {
          if (file.name.endsWith('.md')) {
            const fileRes = await fetch(file.download_url);
            const text = await fileRes.text();
            
            // Simple Frontmatter Parser
            const frontmatterMatch = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
            if (frontmatterMatch) {
              const metaText = frontmatterMatch[1];
              const bodyText = frontmatterMatch[2];

              const titleMatch = metaText.match(/title:\s*["']?(.*?)["']?\n/);
              const catMatch = metaText.match(/category:\s*["']?(.*?)["']?\n/);
              const imgMatch = metaText.match(/featured_image:\s*["']?(.*?)["']?\n/);
              const locationMatch = metaText.match(/location:\s*["']?(.*?)["']?\n/);
              const dateMatch = metaText.match(/date:\s*["']?(.*?)["']?\n/);

              const category = catMatch ? catMatch[1] : '';

              if (category === targetCategory) {
                matched = true;
                const title = titleMatch ? titleMatch[1] : 'Program Update';
                const featuredImg = imgMatch ? imgMatch[1] : '';
                const location = locationMatch ? locationMatch[1] : 'FCI Campus';
                const date = dateMatch ? new Date(dateMatch[1]).toLocaleDateString() : '';

                const card = document.createElement('article');
                card.className = 'article-card';
                card.innerHTML = `
                  ${featuredImg ? `<img src="${featuredImg}" alt="${title}" class="featured-img">` : ''}
                  <h2>${title}</h2>
                  <div class="meta-info">
                    <span>📍 ${location}</span>
                    ${date ? `<span>📅 ${date}</span>` : ''}
                  </div>
                  <div class="content">${marked.parse(bodyText)}</div>
                `;
                feed.appendChild(card);
              }
            }
          }
        }

        if (!matched) {
          feed.innerHTML = '<div class="article-card"><p>No updates published under this category yet.</p></div>';
        }

      } catch (e) {
        feed.innerHTML = '<div class="article-card"><p>Unable to load posts at this moment.</p></div>';
      }
    }

    loadCategoryPosts();
  </script>
</body>
</html>
