<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program Details | Steps For Social Change</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #1b4332;
      --accent: #2d6a4f;
      --highlight: #52b788;
      --bg-light: #f0f4f1;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-muted: #4b5563;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-light); color: var(--text-main); line-height: 1.8; }

    /* Header */
    header {
      background: linear-gradient(135deg, #081c15 0%, #1b4332 60%, #2d6a4f 100%);
      color: white;
      padding: 60px 20px 100px;
      text-align: center;
      position: relative;
    }
    .nav-back {
      position: absolute;
      top: 30px;
      left: 40px;
      color: #b7e4c7;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .nav-back:hover { color: #ffffff; }

    .category-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: #d8f3dc;
      padding: 6px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 15px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    header h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.5px; }

    /* Main Container & Modern Article Card */
    .main-container { max-width: 1000px; margin: -60px auto 80px; padding: 0 20px; position: relative; z-index: 10; }

    .blog-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 50px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.07);
      margin-bottom: 40px;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .blog-header h2 { font-size: 2.3rem; color: var(--primary); margin-bottom: 15px; font-weight: 800; line-height: 1.3; }
    
    .meta-pills { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 20px; 
      margin-bottom: 25px; 
      color: var(--text-muted); 
      font-size: 0.95rem; 
      font-weight: 600;
      background: #f8fafc;
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .meta-pills span { display: flex; align-items: center; gap: 8px; }

    /* Summary Callout Box */
    .summary-box {
      background: #f0fdf4;
      border-left: 4px solid var(--accent);
      padding: 18px 24px;
      border-radius: 0 12px 12px 0;
      font-size: 1.08rem;
      font-weight: 600;
      color: #166534;
      margin-bottom: 30px;
    }

    .featured-hero-img {
      width: 100%;
      max-height: 520px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 35px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .article-body { font-size: 1.1rem; color: #334155; margin-bottom: 40px; border-bottom: 2px solid #f1f5f9; padding-bottom: 35px; }
    .article-body p { margin-bottom: 1.4rem; }

    .section-title { font-size: 1.4rem; font-weight: 800; color: var(--primary); margin: 40px 0 20px; display: flex; align-items: center; gap: 12px; }

    /* Photo Gallery Grid */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }
    .gallery-grid img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
      transition: all 0.35s ease;
      cursor: pointer;
    }
    .gallery-grid img:hover { transform: translateY(-6px); box-shadow: 0 14px 28px rgba(0,0,0,0.15); }

    /* Video Embed */
    .video-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 18px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .video-container iframe, .video-container video {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;
    }

    /* Document Viewer */
    .document-section {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 30px;
      margin-top: 40px;
    }
    .document-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .document-title-area { display: flex; align-items: center; gap: 12px; }
    .document-icon { font-size: 2.2rem; }
    .download-btn {
      background: var(--accent);
      color: white;
      padding: 10px 22px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s, transform 0.2s;
    }
    .download-btn:hover { background: var(--primary); transform: translateY(-2px); }

    .pdf-viewer-frame {
      width: 100%;
      height: 600px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: #ffffff;
    }

    .no-posts { text-align: center; padding: 80px 20px; color: var(--text-muted); background: white; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); }

    @media (max-width: 768px) {
      .blog-card { padding: 25px; }
      header h1 { font-size: 2.1rem; }
      .pdf-viewer-frame { height: 400px; }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html#programmes" class="nav-back"><span>←</span> Back to Home</a>
    <span class="category-badge" id="category-name">Program Updates</span>
    <h1>Program Impact & Vlogs</h1>
  </header>

  <main class="main-container" id="vlog-container">
    <div class="blog-card"><p style="text-align:center; color: var(--text-muted);">Loading program updates...</p></div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const selectedCategory = urlParams.get('category') || 'empowering-grassroots';

    document.getElementById('category-name').innerText = selectedCategory.replace(/-/g, ' ');

    // Normalize image paths to always start with /
    function fixPath(path) {
      if (!path) return '';
      path = path.trim();
      if (!path.startsWith('/') && !path.startsWith('http')) {
        return '/' + path;
      }
      return path;
    }

    async function fetchProgramPosts() {
      const container = document.getElementById('vlog-container');
      try {
        const response = await fetch('https://api.github.com/repos/VADITHYKISHORENAIK/stepsforsocialchange/contents/content/programs');
        const files = await response.json();

        if (!Array.isArray(files) || files.length === 0) {
          container.innerHTML = '<div class="no-posts"><h3>No updates published for this program yet</h3></div>';
          return;
        }

        container.innerHTML = '';
        let matchCount = 0;

        for (let file of files) {
          if (file.name.endsWith('.md')) {
            const rawRes = await fetch(file.download_url);
            const markdown = await rawRes.text();

            const fmMatch = markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
            if (!fmMatch) continue;

            const yamlText = fmMatch[1];
            const bodyText = fmMatch[2];

            const getVal = (key) => {
              const m = yamlText.match(new RegExp(`${key}:\\s*["']?(.*?)["']?\\n`));
              return m ? m[1].trim() : '';
            };

            const category = getVal('category');
            if (category !== selectedCategory) continue;

            matchCount++;
            const title = getVal('title') || 'Program Update';
            const location = getVal('location') || 'Field Location';
            const summary = getVal('summary');
            const rawDate = getVal('date');
            const dateStr = rawDate ? new Date(rawDate).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
            const featuredImage = fixPath(getVal('featured_image'));
            const videoUrl = getVal('video_url');
            const docFile = fixPath(getVal('document_file'));

            // Robust multi-line gallery image extractor
            const galleryImages = [];
            const matches = yamlText.matchAll(/image:\s*["']?(.*?)["']?$/gm);
            for (const match of matches) {
              const cleaned = fixPath(match[1]);
              if (cleaned && cleaned !== featuredImage) {
                galleryImages.push(cleaned);
              }
            }

            // Fallback line search for YAML lists
            if (galleryImages.length === 0) {
              const lines = yamlText.split('\n');
              let inGallery = false;
              for (let line of lines) {
                if (line.trim().startsWith('gallery:')) { inGallery = true; continue; }
                if (inGallery) {
                  if (line.trim().startsWith('-')) {
                    const rawImg = line.replace(/.*-\s*["']?/, '').replace(/["']?$/, '').trim();
                    const fixed = fixPath(rawImg);
                    if (fixed) galleryImages.push(fixed);
                  } else if (line.trim() !== '' && !line.startsWith(' ') && !line.startsWith('\t')) {
                    inGallery = false;
                  }
                }
              }
            }

            const card = document.createElement('article');
            card.className = 'blog-card';

            let summaryHTML = '';
            if (summary) {
              summaryHTML = `<div class="summary-box">💡 ${summary}</div>`;
            }

            let galleryHTML = '';
            if (galleryImages.length > 0) {
              galleryHTML = `
                <div class="section-title">📸 Event Photo Gallery (${galleryImages.length} Photos)</div>
                <div class="gallery-grid">
                  ${galleryImages.map(img => `<img src="${img}" alt="Event photo" loading="lazy" onclick="window.open('${img}', '_blank')">`).join('')}
                </div>
              `;
            }

            let videoHTML = '';
            if (videoUrl) {
              videoHTML = `
                <div class="section-title">🎥 Program Video</div>
                <div class="video-container">
                  <iframe src="${videoUrl}" allowfullscreen></iframe>
                </div>
              `;
            }

            let docHTML = '';
            if (docFile) {
              docHTML = `
                <div class="document-section">
                  <div class="document-header">
                    <div class="document-title-area">
                      <span class="document-icon">📑</span>
                      <div>
                        <strong>Official Program Report & Documents</strong>
                        <p style="font-size:0.88rem; color:#64748b;">Read directly below or download to your device</p>
                      </div>
                    </div>
                    <a href="${docFile}" download class="download-btn">📥 Download Document</a>
                  </div>
                  <iframe src="${docFile}" class="pdf-viewer-frame" title="Program Document Viewer"></iframe>
                </div>
              `;
            }

            card.innerHTML = `
              <div class="blog-header">
                <h2>${title}</h2>
                <div class="meta-pills">
                  <span>📍 ${location}</span>
                  ${dateStr ? `<span>📅 ${dateStr}</span>` : ''}
                </div>
              </div>

              ${summaryHTML}

              ${featuredImage ? `<img src="${featuredImage}" alt="${title}" class="featured-hero-img">` : ''}

              <div class="article-body">
                ${marked.parse(bodyText)}
              </div>

              ${galleryHTML}
              ${videoHTML}
              ${docHTML}
            `;

            container.appendChild(card);
          }
        }

        if (matchCount === 0) {
          container.innerHTML = '<div class="no-posts"><h3>No updates published for this program yet</h3></div>';
        }

      } catch (err) {
        container.innerHTML = '<div class="no-posts"><h3>Unable to load updates at this time</h3></div>';
      }
    }

    fetchProgramPosts();
  </script>
</body>
</html>
