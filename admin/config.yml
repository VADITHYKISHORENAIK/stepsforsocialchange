backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "programs"
    label: "Program Vlogs & Updates"
    folder: "content/programs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Program Category", name: "category", widget: "select", options: ["empowering-grassroots", "education", "women-empowerment", "healthcare", "livelihood", "disaster-response", "culture-conservation"] }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Photo Gallery", name: "gallery", widget: "list", field: { label: "Photo", name: "image", widget: "image" }, required: false }
      - { label: "Location / Venue", name: "location", widget: "string", default: "Food Corporation of India (FCI)" }
      - { label: "Summary", name: "summary", widget: "text" }
      - { label: "Full Content / Article", name: "body", widget: "markdown" }
